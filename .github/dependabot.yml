version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "ci(deps)"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]

  - package-ecosystem: "composer"
    directory: "/"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "direct"
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]
